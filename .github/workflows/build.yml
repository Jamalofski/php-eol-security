name: Build
run-name: Build PHP ${{ inputs.branch }} (release=${{ inputs.release }})

on:
  workflow_dispatch:
    inputs:
      branch:
        description: PHP branch, as listed in versions.json
        type: choice
        options: ['8.1', '8.0', '7.4', '7.3', '7.2']
      release:
        description: Publish a GitHub release with the binaries
        type: boolean
        default: false

env:
  # Official Windows builder (php/php-windows-builder), pinned
  BUILDER_SHA: 5f63433eb2bda2ca8d0d970fe487be84f7ab195c
  PHP_BUILD_PROVIDER: "Jamal TANTAOUI (unofficial EOL security build) - https://github.com/Jamalofski/php-eol-security"

permissions:
  contents: read

jobs:
  config:
    name: Config ${{ inputs.branch }}
    runs-on: ubuntu-latest
    outputs:
      php_src_repo: ${{ steps.cfg.outputs.php_src_repo }}
      php_src_sha: ${{ steps.cfg.outputs.php_src_sha }}
      base_version: ${{ steps.cfg.outputs.base_version }}
      version_suffix: ${{ steps.cfg.outputs.version_suffix }}
      compiler: ${{ steps.cfg.outputs.compiler }}
      build_provider: ${{ steps.cfg.outputs.build_provider }}
      extra_configure: ${{ steps.cfg.outputs.extra_configure }}
      latest: ${{ steps.cfg.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read versions.json
        id: cfg
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          jq -e --arg b "$BRANCH" '.[$b]' versions.json > cfg.json
          cat cfg.json
          {
            echo "php_src_repo=$(jq -r .php_src_repo cfg.json)"
            echo "php_src_sha=$(jq -r .php_src_sha cfg.json)"
            echo "base_version=$(jq -r .base_version cfg.json)"
            # "pl" (patch level) sorts after the base version for version_compare() and Composer
            echo "version_suffix=-pl$(jq -r .patch_level cfg.json)"
            echo "compiler=$(jq -r .compiler cfg.json)"
            echo "build_provider=$(jq -r .build_provider cfg.json)"
            echo "extra_configure=$(jq -c '.extra_configure // []' cfg.json)"
            # Only the highest branch gets the "Latest" badge on GitHub
            echo "latest=$(jq -r --arg b "$BRANCH" 'keys | map(split(".") | map(tonumber)) | max | map(tostring) | join(".") == $b' versions.json)"
          } >> "$GITHUB_OUTPUT"

      # Every commit between the official release and the pinned sources must be an
      # official php-src commit, or an adaptation reviewed in verification/reviews.json
      - name: Verify sources against php-src
        env:
          BRANCH: ${{ inputs.branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/verify_backports.py "$BRANCH"
          cat "verification/$BRANCH.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  build:
    name: Build ${{ inputs.branch }} ${{ matrix.arch }} ${{ matrix.ts }}
    needs: config
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        ts: [nts, ts]
    # Same runner image as the official builds; the builder installs the
    # toolset of the branch (vc15 for 7.2 to 7.4, vs16 for 8.0 and 8.1)
    runs-on: windows-2022
    env:
      PHP_SRC_REPO: ${{ needs.config.outputs.php_src_repo }}
      PHP_SRC_SHA: ${{ needs.config.outputs.php_src_sha }}
      BASE_VERSION: ${{ needs.config.outputs.base_version }}
      VERSION_SUFFIX: ${{ needs.config.outputs.version_suffix }}
      # For OCI8 (8.0 and later), configure.bat resolves the Oracle SDK as
      # ..\..\..\..\instantclient from the source directory, so the sources sit
      # four levels below the workspace.
      SRC_DIR: build/${{ matrix.arch }}/${{ matrix.ts }}/php-src
    steps:
      - name: git config
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout php-windows-builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: php/php-windows-builder
          ref: ${{ env.BUILDER_SHA }}
          path: builder

      - name: Checkout php-src
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ env.PHP_SRC_REPO }}
          ref: ${{ env.PHP_SRC_SHA }}
          path: ${{ env.SRC_DIR }}

      - name: Oracle Instant Client SDK
        shell: pwsh
        run: |
          $suffix = if ('${{ matrix.arch }}' -eq 'x86') { 'nt' } else { 'windows' }
          Invoke-WebRequest "https://download.oracle.com/otn_software/nt/instantclient/instantclient-sdk-$suffix.zip" -OutFile instantclient-sdk.zip
          Expand-Archive instantclient-sdk.zip -DestinationPath .
          Move-Item instantclient_* instantclient

      - name: Extra configure options
        if: needs.config.outputs.extra_configure != '[]'
        shell: pwsh
        env:
          EXTRA_CONFIGURE: ${{ needs.config.outputs.extra_configure }}
        run: |
          # Options of the original releases of the branch that the builder's
          # configuration lacks (OCI8 and PDO_OCI for PHP 7)
          $vs = (Get-Content builder/php/BuildPhp/config/vs.json -Raw | ConvertFrom-Json).php.'${{ inputs.branch }}'
          $bat = "builder/php/BuildPhp/config/$vs/${{ matrix.arch }}/config.${{ matrix.ts }}.bat"
          $content = Get-Content $bat -Raw
          if (-not $content.Contains(' %*')) { throw "${bat}: '%*' not found" }
          $options = ($env:EXTRA_CONFIGURE | ConvertFrom-Json | ForEach-Object { "`"$_`"" }) -join ' '
          Set-Content $bat $content.Replace(' %*', " $options %*") -NoNewline
          Get-Content $bat

      - name: Set version
        shell: pwsh
        working-directory: ${{ env.SRC_DIR }}
        run: |
          # EOL branches may carry a "-dev" bump after their last release: the
          # version is set from versions.json, not kept from the sources.
          $version = "$env:BASE_VERSION$env:VERSION_SUFFIX"
          [int]$major, [int]$minor, [int]$release = $env:BASE_VERSION.Split('.')
          $configure = if ((Get-Content configure.ac -Raw).Contains('AC_INIT([PHP],')) {
            @(@{ File = 'configure.ac'; From = 'AC_INIT\(\[PHP\],\[[^\]]+\]'; To = "AC_INIT([PHP],[$version]" })
          } else {
            # PHP 7.3 and older set the version in shell variables of configure.ac
            @(
              @{ File = 'configure.ac'; From = '(?m)^PHP_RELEASE_VERSION=\d+$'; To = "PHP_RELEASE_VERSION=$release" },
              @{ File = 'configure.ac'; From = '(?m)^PHP_EXTRA_VERSION="[^"]*"$'; To = "PHP_EXTRA_VERSION=`"$env:VERSION_SUFFIX`"" }
            )
          }
          $patches = @($configure) + @(
            @{ File = 'main/php_version.h'; From = "#define PHP_MAJOR_VERSION $major\b"; To = "#define PHP_MAJOR_VERSION $major" },
            @{ File = 'main/php_version.h'; From = "#define PHP_MINOR_VERSION $minor\b"; To = "#define PHP_MINOR_VERSION $minor" },
            @{ File = 'main/php_version.h'; From = '#define PHP_RELEASE_VERSION \d+'; To = "#define PHP_RELEASE_VERSION $release" },
            @{ File = 'main/php_version.h'; From = '#define PHP_EXTRA_VERSION "[^"]*"'; To = "#define PHP_EXTRA_VERSION `"$env:VERSION_SUFFIX`"" },
            @{ File = 'main/php_version.h'; From = '#define PHP_VERSION "[^"]*"'; To = "#define PHP_VERSION `"$version`"" },
            @{ File = 'main/php_version.h'; From = '#define PHP_VERSION_ID \d+'; To = "#define PHP_VERSION_ID $($major * 10000 + $minor * 100 + $release)" }
          )
          foreach ($p in $patches) {
            $content = Get-Content $p.File -Raw
            $count = ([regex]::Matches($content, $p.From)).Count
            if ($count -ne 1) { throw "$($p.File): '$($p.From)' matched $count times" }
            Set-Content $p.File ([regex]::Replace($content, $p.From, $p.To)) -NoNewline
          }
          git diff

      - name: Build
        shell: pwsh
        working-directory: ${{ env.SRC_DIR }}
        env:
          # SBOM files inside the zips, as in the official builds
          SBOM: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\builder\php\BuildPhp" -Force
          Invoke-PhpBuild -Arch ${{ matrix.arch }} -Ts ${{ matrix.ts }}

      # Before the tests, so that a failing test keeps the binaries for inspection;
      # the package job only runs when every build job, tests included, succeeded.
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-${{ needs.config.outputs.base_version }}-${{ matrix.arch }}-${{ matrix.ts }}
          path: ${{ env.SRC_DIR }}/artifacts/*

      - name: Official smoke test
        shell: pwsh
        working-directory: ${{ env.SRC_DIR }}
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\builder\php\BuildPhp" -Force
          Invoke-PhpSmokeTests -ArtifactsDirectory artifacts -Arch ${{ matrix.arch }} -Ts ${{ matrix.ts }}

      - name: Build identity and extensions
        shell: pwsh
        working-directory: ${{ env.SRC_DIR }}/artifacts
        env:
          COMPILER: ${{ needs.config.outputs.compiler }}
          CHECK_PROVIDER: ${{ needs.config.outputs.build_provider }}
          EXTRA_CONFIGURE: ${{ needs.config.outputs.extra_configure }}
        run: |
          Get-ChildItem | Format-Table Name, Length
          $zip = Get-ChildItem "php-$env:BASE_VERSION*.zip" | Select-Object -First 1
          if (-not $zip) { throw 'binary zip not found' }
          $dir = Join-Path $env:RUNNER_TEMP php
          Expand-Archive $zip.FullName -DestinationPath $dir
          $php = Join-Path $dir php.exe

          $info = & $php -n -i | Out-String
          $expected = [ordered]@{
            'PHP Version' = "$env:BASE_VERSION$env:VERSION_SUFFIX"
            'Compiler' = $env:COMPILER
            'Thread Safety' = $(if ('${{ matrix.ts }}' -eq 'ts') { 'enabled' } else { 'disabled' })
          }
          # PHP 7 has no "Build Provider" entry
          if ($env:CHECK_PROVIDER -eq 'true') { $expected['Build Provider'] = $env:PHP_BUILD_PROVIDER }
          foreach ($key in $expected.Keys) {
            $line = ($info -split "`r?`n" | Where-Object { $_ -like "$key =>*" } | Select-Object -First 1)
            Write-Host $line
            if (-not $line -or -not $line.Contains($expected[$key])) { throw "$key mismatch, expected '$($expected[$key])'" }
          }

          # Shared extensions enabled by the extra configure options are shipped
          foreach ($option in ($env:EXTRA_CONFIGURE | ConvertFrom-Json)) {
            if ($option -match '^--with-([a-z0-9-]+)=.*,shared$') {
              $dll = Join-Path $dir "ext\php_$($Matches[1] -replace '-', '_').dll"
              if (-not (Test-Path $dll)) { throw "$(Split-Path $dll -Leaf) is missing" }
              Write-Host "$(Split-Path $dll -Leaf) shipped"
            }
          }

          # Every shipped extension loads without any startup warning. Same exclusions
          # as the official smoke test: Oracle and Firebird need client libraries that
          # are not shipped, SNMP needs MIB files.
          $loadArgs = @()
          foreach ($dll in Get-ChildItem (Join-Path $dir ext) -Filter 'php_*.dll') {
            if ($dll.Name -in 'php_pdo_firebird.dll', 'php_snmp.dll', 'php_pdo_oci.dll' -or $dll.Name -like 'php_oci8*.dll') { continue }
            $directive = if ($dll.Name -eq 'php_opcache.dll') { 'zend_extension' } else { 'extension' }
            $loadArgs += '-d', "$directive=$($dll.FullName)"
          }
          Write-Host "Loading $($loadArgs.Count / 2) extensions"
          $out = (& $php -n @loadArgs -d opcache.enable_cli=1 -r "echo opcache_get_status() === false ? 'KO' : 'ok';" 2>&1 | Out-String).Trim()
          Write-Host $out
          if ($out -ne 'ok') { throw 'extensions did not load cleanly' }

  package:
    name: Checksums and release ${{ inputs.branch }}
    needs: [config, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PHP_SRC_REPO: ${{ needs.config.outputs.php_src_repo }}
      PHP_SRC_SHA: ${{ needs.config.outputs.php_src_sha }}
      BASE_VERSION: ${{ needs.config.outputs.base_version }}
      VERSION_SUFFIX: ${{ needs.config.outputs.version_suffix }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Only what users download: the binary zips, their devel packs and CycloneDX SBOMs.
      # The debug and test packs and the SPDX copy of each SBOM stay out of the release.
      - name: Drop unpublished files
        working-directory: dist
        run: rm -fv php-debug-pack-*.zip php-test-pack-*.zip *.spdx.json

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.zip *.json | tee SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS-${{ needs.config.outputs.base_version }}
          path: dist/SHA256SUMS

      # Signed build provenance for each zip, linking it to this workflow run and commit
      - name: Attest
        if: inputs.release
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.config.outputs.latest }}
        run: |
          VERSION="${BASE_VERSION}${VERSION_SUFFIX}"
          LEVEL="${VERSION_SUFFIX#-pl}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          TS_ZIP=$(cd dist && ls php-${VERSION}-Win32-*-x64.zip)
          NTS_ZIP=$(cd dist && ls php-${VERSION}-nts-Win32-*-x64.zip)
          cat > notes.md <<EOF
          Unofficial Windows build of PHP ${BASE_VERSION} with security fixes. **Not an official PHP Group release.**

          - Version: \`${VERSION}\` (Patch Level ${LEVEL})
          - Which zip: \`${TS_ZIP}\` (Thread Safe) for Apache with mod_php, \`${NTS_ZIP}\` (NTS) for IIS, nginx or the command line; x86 zips for 32-bit servers.
          - Source: [${PHP_SRC_REPO}@${PHP_SRC_SHA:0:7}](${GITHUB_SERVER_URL}/${PHP_SRC_REPO}/commit/${PHP_SRC_SHA})
          - Fixes included: [PATCHES.md](${REPO_URL}/blob/${GITHUB_SHA}/PATCHES.md)
          - Built and tested by [run ${GITHUB_RUN_ID}](${REPO_URL}/actions/runs/${GITHUB_RUN_ID}) (GitHub keeps run logs for 90 days)
          - Checksums: \`SHA256SUMS\`
          - SBOM: CycloneDX (\`.cdx.json\`) file next to each binary zip
          - Devel packs (\`php-devel-pack-…\`) for building extensions
          - Provenance: \`gh attestation verify ${NTS_ZIP} --repo ${GITHUB_REPOSITORY}\`
          EOF
          cat notes.md
          gh release create "php-${VERSION}" dist/*.zip dist/*.json dist/SHA256SUMS \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest="$LATEST" \
            --title "PHP ${VERSION}" \
            --notes-file notes.md
