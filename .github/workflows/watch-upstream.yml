name: Watch upstream
run-name: Watch upstream php-src

on:
  schedule:
    # Mondays, 06:17 UTC
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # For the "Keep the schedule alive" step
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check php-src
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Advisories published up to then are known: patch level 2 carries their
          # backports (see PATCHES.md)
          WATCH_SINCE: '2026-10-21T13:35:00Z'
          NOTIFY: Jamalofski
        run: python3 .github/scripts/watch_upstream.py

      # GitHub disables the scheduled workflows of a public repository after 60
      # days without activity; re-enabling the workflow through the API on each
      # run keeps the schedule alive.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/watch-upstream.yml/enable"
