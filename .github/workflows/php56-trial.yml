name: PHP 5.6 toolchain trial
run-name: PHP 5.6 trial ${{ inputs.arch }} ${{ inputs.ts }} (${{ inputs.repo }}@${{ inputs.sha }})

# One-off trial, before any 5.6 build is published: can the 5.6 branch of
# remicollet/php-src-security be built on a GitHub runner with the toolset of the
# official 5.6 releases (Visual C++ 2012, VC11), so that the binaries stay
# compatible with the existing 5.6 extensions? php-windows-builder starts at 7.1,
# so this job installs VC11 from Microsoft's own ISOs, uses the PHP SDK of the 5.x
# era and the official vc11 dependency pack of 5.6. Nothing is published.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Source repository (the fork carries the VC11 fixes proposed upstream)
        type: choice
        options: [remicollet/php-src-security, Jamalofski/php-src-security]
        default: remicollet/php-src-security
      sha:
        description: Commit to build (PHP-5.6-security-backports-openssl11 or a branch based on it)
        default: f98c3c2b5ffca6bed55e6d514307facdcfc35f78
      arch:
        type: choice
        options: [x64, x86]
        default: x64
      ts:
        type: choice
        options: [nts, ts]
        default: nts
      debug:
        description: Debug build (--enable-debug), compiled only
        type: boolean
        default: false
      tests:
        description: Test files or directories for run-tests.php, separated by spaces (wildcards allowed)
        default: ''
      baseline:
        description: Run the same tests with the official PHP 5.6.40 binaries too, to tell build issues from test environment issues
        type: boolean
        default: false
      build:
        description: Build PHP (off to run only the baseline with the official binaries)
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Visual Studio Express 2012 for Windows Desktop and its Update 4, as Microsoft
  # still serves them. The digests match those another project pinned for the
  # same files (riyukuro/MS2Recomp, tools/fetch-vs2012.sh).
  VS2012_WDX_URL: https://download.microsoft.com/download/1/F/5/1F519CC5-0B90-4EA3-8159-33BFB97EF4D9/VS2012_WDX_ENU.iso
  VS2012_WDX_SHA256: d38e57b269aed44a41ce2b74b78dad3b92d2bc553fc4b71180080a8936ce2ffb
  VS2012_U4_URL: https://download.microsoft.com/download/D/4/8/D48D1AC2-A297-4C9E-A9D0-A218E6609F06/VSU4/VS2012.4.iso
  VS2012_U4_SHA256: c462118eabcc242a50f1215587cb1c79505159af79fc50c24d8be1d25203cd87
  # PHP SDK and dependency pack of the 5.6 releases (downloads.php.net); their
  # digests are reported by this trial, to be pinned by the real build.
  PHP_SDK_URL: https://downloads.php.net/~windows/php-sdk/php-sdk-binary-tools-20110915.zip
  PHP_DEPS_URL: https://downloads.php.net/~windows/php-sdk/archives/deps-5.6-vc11-${{ inputs.arch }}_2018-12.7z
  # The openssl11 branch uses the OpenSSL 1.1 API only, while the vc11 pack has
  # OpenSSL 1.0.2q: OpenSSL 1.1.1w (last public 1.1.1 release) is built with VC11.
  OPENSSL_URL: https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
  OPENSSL_SHA256: cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8
  # libssh2 and libcurl of the pack are tied to OpenSSL 1.0 too (curl reported
  # OpenSSL/1.0.2q): the current releases are built with VC11 against 1.1.1w.
  LIBSSH2_URL: https://github.com/libssh2/libssh2/releases/download/libssh2-1.11.1/libssh2-1.11.1.tar.gz
  LIBSSH2_SHA256: d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7
  # curl 8.18.0 and later require OpenSSL 3, which VC11 cannot compile (C99):
  # curl 8.17.0 is the last release that builds with OpenSSL 1.1.1.
  CURL_URL: https://github.com/curl/curl/releases/download/curl-8_17_0/curl-8.17.0.tar.gz
  CURL_SHA256: e8e74cdeefe5fb78b3ae6e90cd542babf788fa9480029cfcee6fd9ced42b7910
  # zlib 1.2.7.3 of the pack (2013) has known flaws: zlib 1.4, for PHP and curl
  ZLIB_URL: https://github.com/madler/zlib/releases/download/v1.4/zlib-1.4.tar.gz
  ZLIB_SHA256: 02dd159783677a749c04adbdd02b55b8a2bcc7e054f51b76b549199a916ad584

jobs:
  trial:
    name: PHP 5.6 ${{ inputs.arch }} ${{ inputs.ts }}
    if: inputs.build
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: git config
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout php-src
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          path: php-src

      - name: Download Visual Studio 2012
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\vs2012"
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($iso in @(
            @{ Name = 'wdx.iso'; Url = $env:VS2012_WDX_URL; Sha = $env:VS2012_WDX_SHA256 },
            @{ Name = 'u4.iso'; Url = $env:VS2012_U4_URL; Sha = $env:VS2012_U4_SHA256 }
          )) {
            # 2.5 GB for Update 4: retry on any error, resuming the partial file
            curl.exe -sSfL --retry 5 --retry-all-errors --retry-delay 15 -C - -o "$dir\$($iso.Name)" $iso.Url
            if ($LASTEXITCODE) { throw "download of $($iso.Url) failed" }
            $sha = (Get-FileHash "$dir\$($iso.Name)" -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $iso.Sha) { throw "$($iso.Url): sha256 $sha, expected $($iso.Sha)" }
            "$($iso.Name): $sha"
          }

      - name: Install Visual Studio Express 2012 and Update 4
        shell: pwsh
        timeout-minutes: 90
        run: |
          $dir = "$env:RUNNER_TEMP\vs2012"
          foreach ($step in @(
            @{ Iso = 'wdx.iso'; Exe = 'wdexpress_full.exe'; Args = '/Quiet /NoRestart /Full' },
            @{ Iso = 'u4.iso'; Exe = 'VS2012.4.exe'; Args = '/Quiet /NoRestart' }
          )) {
            $drive = (Mount-DiskImage "$dir\$($step.Iso)" -PassThru | Get-Volume).DriveLetter
            Get-ChildItem "${drive}:\" | Format-Table Name, Length
            $exe = "${drive}:\$($step.Exe)"
            if (-not (Test-Path $exe)) { throw "$exe not found on $($step.Iso)" }
            $log = "$dir\$($step.Exe).log"
            $p = Start-Process $exe -ArgumentList "$($step.Args) /Log `"$log`"" -Wait -PassThru
            "$($step.Exe): exit code $($p.ExitCode)"
            # 3010: success, reboot required
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "$($step.Exe) failed with $($p.ExitCode)" }
            Dismount-DiskImage "$dir\$($step.Iso)" | Out-Null
          }
          $vc = 'C:\Program Files (x86)\Microsoft Visual Studio 11.0\VC'
          Get-ChildItem "$vc\bin" -Recurse -Filter cl.exe | ForEach-Object { "$($_.FullName) $($_.VersionInfo.FileVersion)" }

      - name: PHP SDK and dependencies
        shell: pwsh
        run: |
          curl.exe -sSfL --retry 3 -o sdk.zip $env:PHP_SDK_URL
          curl.exe -sSfL --retry 3 -o deps.7z $env:PHP_DEPS_URL
          foreach ($f in 'sdk.zip', 'deps.7z') { "${f}: $((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())" }
          Expand-Archive sdk.zip -DestinationPath C:\php-sdk
          7z x deps.7z -oC:\deps-raw | Out-Null
          $deps = Get-ChildItem C:\deps-raw -Recurse -Directory -Filter include | Select-Object -First 1 | ForEach-Object { $_.Parent.FullName }
          if (-not $deps) { throw 'no include directory in the dependency pack' }
          Move-Item $deps C:\deps
          Get-ChildItem C:\php-sdk\bin | Select-Object -ExpandProperty Name
          Get-ChildItem C:\deps\bin, C:\deps\lib | Select-Object -ExpandProperty Name
          # Which libraries of the pack are tied to OpenSSL 1.0 (import or symbol names)
          $tied = Get-ChildItem C:\deps\lib\*.lib, C:\deps\bin\*.dll | Where-Object {
            Select-String -LiteralPath $_.FullName -Pattern 'libeay32|ssleay32|SSL_library_init' -Quiet
          } | ForEach-Object { $_.Name }
          $summary = @('## Libraries of the vc11 pack tied to OpenSSL 1.0', '', ($tied -join ', '), '')
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $summary

      - name: Download OpenSSL
        shell: pwsh
        run: |
          curl.exe -sSfL --retry 3 -o openssl.tar.gz $env:OPENSSL_URL
          $sha = (Get-FileHash openssl.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:OPENSSL_SHA256) { throw "openssl.tar.gz: sha256 $sha, expected $env:OPENSSL_SHA256" }
          tar -xzf openssl.tar.gz -C $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'extraction failed' }

      - name: Build OpenSSL with VC11
        shell: cmd
        working-directory: ${{ runner.temp }}\openssl-1.1.1w
        run: |
          if "${{ inputs.arch }}"=="x64" (set VCARCH=x86_amd64& set TARGET=VC-WIN64A& set MACHINE=X64) else (set VCARCH=x86& set TARGET=VC-WIN32& set MACHINE=X86)
          call "C:\Program Files (x86)\Microsoft Visual Studio 11.0\VC\vcvarsall.bat" %VCARCH% || exit /b 1
          rem The VC11 linker takes X86 from the .res files when no machine is given
          rem (LNK1112 on libssl in x64): LINK passes the option to every link.
          set LINK=/MACHINE:%MACHINE%
          set PATH=C:\Strawberry\perl\bin;%PATH%
          perl -v | findstr /c:"This is perl"
          rem no-asm for this trial only: a release build needs NASM (AES-NI and the other assembler paths)
          perl Configure %TARGET% no-asm no-tests --prefix=C:\openssl111 || exit /b 1
          nmake > ..\openssl-build.log 2>&1 || (type ..\openssl-build.log & exit /b 1)
          nmake install_sw > nul || exit /b 1
          rem Replace OpenSSL 1.0.2q of the pack with 1.1.1w
          rmdir /s /q C:\deps\include\openssl
          xcopy /e /i /q C:\openssl111\include\openssl C:\deps\include\openssl || exit /b 1
          del C:\deps\lib\libeay32.lib C:\deps\lib\ssleay32.lib
          copy /y C:\openssl111\lib\libcrypto.lib C:\deps\lib || exit /b 1
          copy /y C:\openssl111\lib\libssl.lib C:\deps\lib || exit /b 1
          copy /y C:\openssl111\bin\*.dll C:\deps\bin || exit /b 1
          dir /b C:\openssl111\bin

      - name: Download zlib, libssh2 and curl
        shell: pwsh
        run: |
          foreach ($lib in @(
            @{ Name = 'zlib.tar.gz'; Url = $env:ZLIB_URL; Sha = $env:ZLIB_SHA256 },
            @{ Name = 'libssh2.tar.gz'; Url = $env:LIBSSH2_URL; Sha = $env:LIBSSH2_SHA256 },
            @{ Name = 'curl.tar.gz'; Url = $env:CURL_URL; Sha = $env:CURL_SHA256 }
          )) {
            curl.exe -sSfL --retry 3 -o $lib.Name $lib.Url
            if ($LASTEXITCODE) { throw "download of $($lib.Url) failed" }
            $sha = (Get-FileHash $lib.Name -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $lib.Sha) { throw "$($lib.Name): sha256 $sha, expected $($lib.Sha)" }
            tar -xzf $lib.Name -C $env:RUNNER_TEMP
            if ($LASTEXITCODE) { throw "extraction of $($lib.Name) failed" }
          }

      - name: Build zlib with VC11
        shell: cmd
        working-directory: ${{ runner.temp }}\zlib-1.4
        run: |
          if "${{ inputs.arch }}"=="x64" (set VCARCH=x86_amd64& set MACHINE=X64) else (set VCARCH=x86& set MACHINE=X86)
          call "C:\Program Files (x86)\Microsoft Visual Studio 11.0\VC\vcvarsall.bat" %VCARCH% || exit /b 1
          set LINK=/MACHINE:%MACHINE%
          nmake -f win32\Makefile.msc zlib.lib > ..\zlib-build.log 2>&1 || (type ..\zlib-build.log & exit /b 1)
          mkdir C:\zlib\include C:\zlib\lib
          copy /y zlib.h C:\zlib\include || exit /b 1
          copy /y zconf.h C:\zlib\include || exit /b 1
          copy /y zlib.lib C:\zlib\lib\zlib_a.lib || exit /b 1
          rem In place of zlib 1.2.7.3 of the pack (static, as PHP links it)
          copy /y C:\zlib\include\*.h C:\deps\include || exit /b 1
          copy /y C:\zlib\lib\zlib_a.lib C:\deps\lib || exit /b 1

      - name: Build libssh2 and curl with VC11
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          if "${{ inputs.arch }}"=="x64" (set VCARCH=x86_amd64& set MACHINE=X64) else (set VCARCH=x86& set MACHINE=X86)
          call "C:\Program Files (x86)\Microsoft Visual Studio 11.0\VC\vcvarsall.bat" %VCARCH% || exit /b 1
          set LINK=/MACHINE:%MACHINE%
          cmake --version | findstr /c:"cmake version"
          rem libssh2 as a DLL, as in the PHP builds (php_curl.dll imports libssh2.dll)
          cmake -G "NMake Makefiles" -S libssh2-1.11.1 -B build-libssh2 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=OFF -DCRYPTO_BACKEND=OpenSSL -DOPENSSL_ROOT_DIR=C:/openssl111 -DENABLE_ZLIB_COMPRESSION=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=C:/libssh2 > libssh2-build.log 2>&1 || (type libssh2-build.log & exit /b 1)
          cmake --build build-libssh2 >> libssh2-build.log 2>&1 || (type libssh2-build.log & exit /b 1)
          cmake --install build-libssh2 > nul || exit /b 1
          rem libcurl static (CURL_STATICLIB), with the features of the PHP builds: OpenSSL,
          rem libssh2, zlib, Windows IDN and LDAP; no HTTP/2, as in 5.6.40. Only its own
          rem prefixes are on its include path (C:\deps\include still has the pack's curl headers).
          cmake -G "NMake Makefiles" -S curl-8.17.0 -B build-curl -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON -DBUILD_CURL_EXE=OFF -DBUILD_TESTING=OFF -DBUILD_LIBCURL_DOCS=OFF -DBUILD_MISC_DOCS=OFF -DENABLE_CURL_MANUAL=OFF -DCURL_USE_OPENSSL=ON -DOPENSSL_ROOT_DIR=C:/openssl111 -DCURL_USE_LIBSSH2=ON -DLIBSSH2_INCLUDE_DIR=C:/libssh2/include -DLIBSSH2_LIBRARY=C:/libssh2/lib/libssh2.lib -DCURL_ZLIB=ON -DZLIB_INCLUDE_DIR=C:/zlib/include -DZLIB_LIBRARY=C:/zlib/lib/zlib_a.lib -DUSE_WIN32_IDN=ON -DUSE_NGHTTP2=OFF -DCURL_USE_LIBPSL=OFF -DCURL_BROTLI=OFF -DCURL_ZSTD=OFF -DUSE_LIBIDN2=OFF -DCMAKE_INSTALL_PREFIX=C:/curl > curl-build.log 2>&1 || (type curl-build.log & exit /b 1)
          cmake --build build-curl >> curl-build.log 2>&1 || (type curl-build.log & exit /b 1)
          cmake --install build-curl > nul || exit /b 1
          findstr /c:"Enabled features" /c:"Enabled SSL backends" /c:"Protocols" curl-build.log
          dir /b C:\libssh2\bin C:\libssh2\lib C:\curl\lib
          rem In place of the libssh2 and libcurl of the pack
          del /q C:\deps\bin\libssh2*.dll C:\deps\lib\libssh2*.lib C:\deps\lib\libcurl*.lib
          copy /y C:\libssh2\bin\libssh2.dll C:\deps\bin || exit /b 1
          copy /y C:\libssh2\lib\libssh2.lib C:\deps\lib || exit /b 1
          copy /y C:\libssh2\include\*.h C:\deps\include || exit /b 1
          rem php_curl.dll gets zlib from php5.dll, which exports only the functions curl
          rem 7.59 used (no inflateReset2), and PHP 5.6 does not link iphlpapi.lib
          rem (if_nametoindex): both go into libcurl_a.lib, the PHP sources stay as they are.
          for %%L in (iphlpapi.lib) do set IPHLPAPI=%%~$LIB:L
          if not defined IPHLPAPI (echo iphlpapi.lib not found in LIB & exit /b 1)
          lib /nologo /OUT:C:\deps\lib\libcurl_a.lib C:\curl\lib\libcurl.lib C:\zlib\lib\zlib_a.lib "%IPHLPAPI%" || exit /b 1
          rmdir /s /q C:\deps\include\curl
          xcopy /e /i /q C:\curl\include\curl C:\deps\include\curl || exit /b 1

      - name: Build
        shell: cmd
        working-directory: php-src
        run: |
          if "${{ inputs.arch }}"=="x64" (set VCARCH=x86_amd64) else (set VCARCH=x86)
          call "C:\Program Files (x86)\Microsoft Visual Studio 11.0\VC\vcvarsall.bat" %VCARCH% || exit /b 1
          set PATH=C:\php-sdk\bin;%PATH%
          cl
          bison --version
          re2c --version
          if "${{ inputs.ts }}"=="nts" (set ZTS=--disable-zts) else (set ZTS=--enable-zts)
          if "${{ inputs.debug }}"=="true" set ZTS=%ZTS% --enable-debug
          call buildconf.bat || exit /b 1
          rem The options of the official 5.6.40 builds, without the debug pack, PGO and
          rem OCI8 (no Oracle SDK in this trial: the snapshot build skips what it lacks)
          call configure.bat --enable-snapshot-build --disable-debug-pack %ZTS% --disable-isapi --disable-nsapi --without-mssql --without-pdo-mssql --without-pi3web --with-enchant=shared --enable-com-dotnet=shared --with-mcrypt=static --without-analyzer --with-php-build=C:\deps || exit /b 1
          rem /K: keep building the other targets after an error, to list every file
          rem that VC11 rejects in one run
          nmake /K > ..\nmake.log 2>&1
          set NMAKE_EXIT=%ERRORLEVEL%
          type ..\nmake.log
          exit /b %NMAKE_EXIT%

      - name: Compile errors
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path nmake.log)) { return }
          $errors = Select-String -Path nmake.log -Pattern '^(\S+)\((\d+)\) : (fatal )?error (C\d+): (.*)$' | ForEach-Object { $_.Matches[0] }
          $summary = @('## Compile errors', '', "$($errors.Count) errors in $(@($errors | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique).Count) files", '')
          foreach ($file in $errors | Group-Object { $_.Groups[1].Value }) {
            $lines = ($file.Group | ForEach-Object { $_.Groups[2].Value } | Sort-Object { [int]$_ } -Unique) -join ', '
            $first = $file.Group[0]
            $summary += "- ``$($file.Name)`` lines $lines (first: $($first.Groups[4].Value) $($first.Groups[5].Value))"
          }
          $summary += '', 'Link failures:', '', '```'
          $summary += Select-String -Path nmake.log -Pattern 'fatal error LNK\d+' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique
          $summary += '```', '', 'Unresolved symbols:', '', '```'
          $summary += (Select-String -Path nmake.log -Pattern 'unresolved external symbol (\S+)' | ForEach-Object { "$($_.Line.Split(' :')[0]) $($_.Matches[0].Groups[1].Value)" } | Select-Object -Unique -First 60)
          $summary += '```'
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $summary

      - name: Check the binaries
        if: always() && !inputs.debug
        shell: pwsh
        working-directory: php-src
        run: |
          $out = Get-ChildItem . -Recurse -Filter php.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1 | ForEach-Object { $_.Directory.FullName }
          if (-not $out) { throw 'php.exe not built' }
          $env:PATH = "$out;C:\deps\bin;$env:PATH"
          $summary = @("## PHP 5.6 trial (${{ inputs.arch }} ${{ inputs.ts }}, ${{ inputs.sha }})", '', '```')
          $summary += & "$out\php.exe" -n -v
          $summary += & "$out\php.exe" -n -i | Select-String -Pattern '^(Compiler|Architecture|Thread Safety|Configure Command)'
          $summary += '```'
          $ok = @(); $failed = @()
          foreach ($dll in Get-ChildItem $out -Filter 'php_*.dll') {
            $directive = if ($dll.Name -eq 'php_opcache.dll') { 'zend_extension' } else { 'extension' }
            $r = & "$out\php.exe" -n -d "extension_dir=$out" -d "$directive=$($dll.Name)" -r 'echo "loaded";' 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0 -and $r.Trim() -eq 'loaded') { $ok += $dll.Name } else { $failed += "$($dll.Name): $($r.Trim())" }
          }
          $summary += '', "Extensions loaded: $($ok.Count)", '', ($ok -join ', '), '', "Extensions that failed: $($failed.Count)", ''
          $summary += $failed | ForEach-Object { "- $_" }
          $summary += '', '```'
          $summary += & "$out\php.exe" -n -d "extension_dir=$out" -d extension=php_openssl.dll -d extension=php_curl.dll -r 'echo OPENSSL_VERSION_TEXT, PHP_EOL; $c = curl_version(); echo "curl ", $c["version"], " ", $c["ssl_version"], " zlib ", $c["libz_version"], " ", isset($c["libssh_version"]) ? $c["libssh_version"] : "no libssh", " protocols ", implode(",", $c["protocols"]), PHP_EOL;' 2>&1
          $summary += '```'
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $summary
          # Imported DLLs: C runtime (msvcr110.dll for VC11) and OpenSSL names
          $dumpbin = Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio 11.0\VC\bin' -Filter dumpbin.exe | Select-Object -First 1
          if ($dumpbin) {
            # dumpbin needs mspdb110.dll from Common7\IDE
            $env:PATH = "C:\Program Files (x86)\Microsoft Visual Studio 11.0\Common7\IDE;$env:PATH"
            $deps = @('', '## Imported DLLs', '', '```')
            foreach ($f in @(Get-ChildItem $out -Filter '*.dll') + @(Get-ChildItem C:\deps\bin -Filter '*.dll') | Where-Object { $_.Name -match '^php5|^php_(openssl|curl|pgsql|pdo_pgsql|ldap|imap|snmp)\.dll$|^lib(pq|ssh2|crypto|ssl)' }) {
              $imports = & $dumpbin.FullName /nologo /dependents $f.FullName 2>&1 | Select-String '^\s+\S+\.dll$' | ForEach-Object { $_.Line.Trim() }
              $deps += "$($f.Name): $($imports -join ', ')"
            }
            $deps += '```'
            $deps | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $deps
          }

      - name: Tests
        if: always() && inputs.tests != '' && !inputs.debug
        timeout-minutes: 20
        shell: pwsh
        working-directory: php-src
        run: |
          $out = Get-ChildItem . -Recurse -Filter php.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1 | ForEach-Object { $_.Directory.FullName }
          $env:PATH = "$out;C:\deps\bin;$env:PATH"
          $env:TEST_PHP_EXECUTABLE = "$out\php.exe"
          $env:NO_INTERACTION = '1'
          $env:REPORT_EXIT_STATUS = '0'
          $list = foreach ($pattern in '${{ inputs.tests }}'.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) {
            Get-ChildItem $pattern -Recurse -Filter *.phpt | ForEach-Object { Resolve-Path -Relative $_.FullName }
          }
          $list | Set-Content tests.txt
          "$(@($list).Count) tests"
          # The extensions come from a php.ini found through PHPRC, not from -d options:
          # the tests that start a second PHP (fake MySQL server, TLS server) pass the
          # -d options on, and Windows mangles the quoted extension_dir on the way.
          # Only the extensions that were built, or every test fails on a startup warning
          @("extension_dir=`"$out`"") + @(
            'php_openssl.dll', 'php_mysqli.dll', 'php_mbstring.dll', 'php_curl.dll' |
              Where-Object { Test-Path "$out\$_" } | ForEach-Object { "extension=$_" }
          ) | Set-Content "$out\php.ini"
          Get-Content "$out\php.ini"
          $env:PHPRC = $out
          & "$out\php.exe" -n run-tests.php -p "$out\php.exe" -q --set-timeout 60 -r tests.txt *> run-tests.log
          $log = Get-Content run-tests.log
          $summary = @('## Tests', '', '```')
          $summary += $log | Select-String -Pattern '^(Number of tests|Tests skipped|Tests warned|Tests failed|Expected fail|Tests passed)' | ForEach-Object { $_.Line }
          $summary += '```', '', 'Failed tests:', '', '```'
          $summary += $log | Select-String -Pattern '^(FAIL|BORK|LEAK)' | ForEach-Object { $_.Line } | Select-Object -First 80
          $summary += '```'
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $summary

      - name: Upload the build and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php56-trial-${{ inputs.arch }}-${{ inputs.ts }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vs2012/*.log
            ${{ runner.temp }}/openssl-build.log
            ${{ runner.temp }}/libssh2-build.log
            ${{ runner.temp }}/curl-build.log
            ${{ runner.temp }}/zlib-build.log
            nmake.log
            php-src/run-tests.log
            php-src/**/*.diff
            php-src/config.nice.bat
            php-src/Makefile
            php-src/**/Release*/*.exe
            php-src/**/Release*/*.dll

  # Reference only, never published: the same tests with the official binaries, in
  # a job of its own (no VC11 needed). The official 5.6.40 hangs on some tests of
  # flaws it does not fix (ext/phar/tests/bug81726.phpt, CVE-2022-31628 quine
  # gzip loop), and run-tests.php cannot stop it on Windows: choose the tests.
  baseline:
    name: Official PHP 5.6.40 ${{ inputs.arch }} ${{ inputs.ts }}
    if: inputs.baseline && inputs.tests != ''
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: git config
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout php-src
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          path: php-src

      - name: Tests with the official 5.6.40
        timeout-minutes: 20
        shell: pwsh
        working-directory: php-src
        run: |
          $zip = if ('${{ inputs.ts }}' -eq 'nts') { 'php-5.6.40-nts-Win32-VC11-${{ inputs.arch }}.zip' } else { 'php-5.6.40-Win32-VC11-${{ inputs.arch }}.zip' }
          curl.exe -sSfL --retry 3 -o official.zip "https://downloads.php.net/~windows/releases/archives/$zip"
          if ($LASTEXITCODE) { throw "download of $zip failed" }
          "${zip}: $((Get-FileHash official.zip -Algorithm SHA256).Hash.ToLower())"
          Expand-Archive official.zip -DestinationPath C:\php5640
          $out = 'C:\php5640'
          @("extension_dir=`"$out\ext`"") + @(
            'php_openssl.dll', 'php_mysqli.dll', 'php_mbstring.dll', 'php_curl.dll' |
              Where-Object { Test-Path "$out\ext\$_" } | ForEach-Object { "extension=$_" }
          ) | Set-Content "$out\php.ini"
          $env:PATH = "$out;$env:PATH"
          $env:PHPRC = $out
          $env:TEST_PHP_EXECUTABLE = "$out\php.exe"
          $env:NO_INTERACTION = '1'
          $env:REPORT_EXIT_STATUS = '0'
          $list = foreach ($pattern in '${{ inputs.tests }}'.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) {
            Get-ChildItem $pattern -Recurse -Filter *.phpt | ForEach-Object { Resolve-Path -Relative $_.FullName }
          }
          $list | Set-Content tests.txt
          "$(@($list).Count) tests"
          & "$out\php.exe" -n run-tests.php -p "$out\php.exe" -q --set-timeout 60 -r tests.txt *> run-tests-official.log
          $log = Get-Content run-tests-official.log
          $summary = @('## Baseline: official PHP 5.6.40', '', '```')
          $summary += $log | Select-String -Pattern '^(Number of tests|Tests skipped|Tests failed|Tests passed)' | ForEach-Object { $_.Line }
          $summary += '```', '', 'Failed tests:', '', '```'
          $summary += $log | Select-String -Pattern '^(FAIL|BORK|LEAK)' | ForEach-Object { $_.Line } | Select-Object -First 100
          $summary += '```'
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $summary

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php56-official-${{ inputs.arch }}-${{ inputs.ts }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            php-src/run-tests-official.log
            php-src/**/*.diff
